<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-layer" class="menu-hidden">
    <!-- Crosshair -->
    <div id="crosshair-container">
      <div class="crosshair-dot"></div>
      <div class="crosshair-line top"></div>
      <div class="crosshair-line bottom"></div>
      <div class="crosshair-line left"></div>
      <div class="crosshair-line right"></div>
    </div>

    <!-- Live Performance Stats -->
    <div id="perf-stats">
      <span>FPS: <span id="stat-fps" class="stat-val">--</span></span>
      <span>COLLISIONS: <span id="stat-bvh" class="stat-val">BVH READY</span></span>
      <span>POS: <span id="stat-pos" class="stat-val">0, 0, 0</span></span>
    </div>
  </div>

  <!-- Start / Pause Menu (Asymmetric Left-Aligned AAA Title Screen) -->
  <div id="start-modal">
    <div class="menu-backdrop-vignette"></div>
    <div class="menu-blur-dock"></div>
    <div class="menu-hero-art" aria-hidden="true"></div>
    <div class="menu-left-panel">
      <!-- Live Telemetry Badge -->
      <div class="telemetry-badge">
        <span class="pulsing-led"></span>
        <span class="telemetry-text">EM DESENVOLVIMENTO</span>
      </div>

      <!-- Main Title Cluster -->
      <div class="title-cluster">
        <h1 class="game-logo">
          <span class="logo-main">ROC AND LOAD!</span>
        </h1>
        <div class="tagline">SHOOT 'EM UP</div>
      </div>

      <!-- Tactical Primary Action Button -->
      <div class="action-container">
        <button id="start-btn" type="button" class="tactical-btn">
          <span class="btn-content">
            <span id="start-btn-text">START</span>
            <span class="btn-chevron">▸</span>
          </span>
        </button>
        <button id="exit-btn" type="button" class="tactical-btn exit-btn" style="display: none;">
          <span class="btn-content">
            <span id="exit-btn-text">EXIT</span>
            <span class="btn-chevron">▸</span>
          </span>
        </button>
        <div class="status-subtext">
          <span class="status-key">STATUS:</span>
          <span id="status-val" class="status-val">READY</span>
        </div>
      </div>

      <!-- Tactical Audio Controls -->
      <div class="menu-audio-controls">
        <button id="bgm-toggle-btn" type="button" class="audio-toggle-btn is-on" title="Toggle Background Music">
          <svg class="audio-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3" fill="currentColor"></circle>
            <circle cx="18" cy="16" r="3" fill="currentColor"></circle>
          </svg>
          <span class="audio-label">BGM:</span>
          <span class="audio-state" id="bgm-state-text">ON</span>
        </button>
        <button id="sfx-toggle-btn" type="button" class="audio-toggle-btn is-on" title="Toggle Sound Effects">
          <svg class="audio-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <span class="audio-label">SFX:</span>
          <span class="audio-state" id="sfx-state-text">ON</span>
        </button>
      </div>

      <!-- Clean Official Menu Footer Credit -->
      <div class="menu-footer">© 2026 Felipe Vicentini</div>
    </div>
  </div>

</body>

</html>
